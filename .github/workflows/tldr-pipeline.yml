name: TLDR Pipeline

# GitHub Actions cron is UTC-only, but the schedule in the build brief is
# Australia/Sydney local time, which shifts between UTC+10 (AEST) and
# UTC+11 (AEDT) with daylight saving. Rather than track DST manually, we
# fire at both possible UTC times for 6am Sydney and let the first job
# step figure out which firing is the real one right now, skipping the
# other silently. Separately, the runner's own system date is UTC, which
# is still the previous day at 6am Sydney -- so the run date used by the
# pipeline is always computed explicitly from Sydney's local calendar
# date, never from the runner's default "today".
on:
  schedule:
    - cron: '0 19 * * 1,4'  # 6am Sydney during AEDT (roughly Oct-Apr)
    - cron: '0 20 * * 1,4'  # 6am Sydney during AEST (roughly Apr-Oct)
  workflow_dispatch:
    inputs:
      run_date:
        description: 'Override run date (YYYY-MM-DD), must be a Tuesday or Friday. Leave blank to use the real current Sydney date -- useful for testing against a known historical date.'
        required: false
        default: ''

permissions:
  contents: write  # needed to commit the generated episode scripts back to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check if this firing should proceed
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manually triggered -- proceeding regardless of time."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(TZ='Australia/Sydney' date +%H)
            DOW=$(TZ='Australia/Sydney' date +%u)  # 1=Monday ... 7=Sunday
            echo "Sydney local time check -- hour: $HOUR, day-of-week: $DOW"
            if [ "$HOUR" = "06" ] && { [ "$DOW" = "2" ] || [ "$DOW" = "5" ]; }; then
              echo "proceed=true" >> "$GITHUB_OUTPUT"
            else
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              echo "Not actually 6am Sydney time on a Tuesday/Friday -- skipping this firing."
            fi
          fi

      - name: Determine run date
        if: steps.check.outputs.proceed == 'true'
        id: rundate
        run: |
          if [ -n "${{ github.event.inputs.run_date }}" ]; then
            RUN_DATE="${{ github.event.inputs.run_date }}"
          else
            RUN_DATE=$(TZ='Australia/Sydney' date +%Y-%m-%d)
          fi
          echo "Using run date: $RUN_DATE"
          echo "run_date=$RUN_DATE" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.proceed == 'true'
        run: pip install anthropic google-auth-oauthlib google-api-python-client google-auth google-auth-httplib2

      - name: Restore secrets to local files
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "JINA_API_KEY=${{ secrets.JINA_API_KEY }}" >> .env
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" >> .env
          printf '%s' '${{ secrets.GMAIL_TOKEN_JSON }}' > token.json

      - name: Run pipeline
        if: steps.check.outputs.proceed == 'true'
        run: python3 scripts/run_pipeline.py "${{ steps.rundate.outputs.run_date }}"

      - name: Commit and push results
        if: steps.check.outputs.proceed == 'true'
        run: |
          git config user.name "TLDR Agent Bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ docs/
          git diff --cached --quiet || git commit -m "Automated run: ${{ steps.rundate.outputs.run_date }}"
          git push
